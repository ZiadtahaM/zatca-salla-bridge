name: ZATCA Phase 2 Salla Bridge CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  zatca-verification:
    name: ZATCA Phase 2 Architectural & Invariant Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zatca_admin
          POSTGRES_PASSWORD: secret_zatca_password
          POSTGRES_DB: zatca_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript Project
        run: npm run build

      - name: TypeScript Static Perimeter & Type Check
        run: npx tsc --noEmit

      - name: Security & Secrets Hygiene Scan
        run: |
          echo "Scanning repository for leaked private keys or hardcoded tokens..."
          ! grep -rn "BEGIN EC PRIVATE KEY" src/
          ! grep -rn "BEGIN RSA PRIVATE KEY" src/

      - name: Unit & Integration Test Suite (Full Invariant & Sync Tests)
        env:
          DATABASE_URL: postgres://zatca_admin:secret_zatca_password@127.0.0.1:5432/zatca_ledger
        run: npm test

      - name: Salla Sync Control & Safe Recovery Regression Gate
        env:
          DATABASE_URL: postgres://zatca_admin:secret_zatca_password@127.0.0.1:5432/zatca_ledger
        run: node --loader ts-node/esm --test tests/sync-control-and-recovery.test.ts

      - name: Master Verification Lever (16 Architecture Gates)
        env:
          DATABASE_URL: postgres://zatca_admin:secret_zatca_password@127.0.0.1:5432/zatca_ledger
        run: npm run verify
